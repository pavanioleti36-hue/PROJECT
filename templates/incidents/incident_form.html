{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="section-header">
  <h1 class="section-title">{{ title }}</h1>
  <a href="{% url 'incidents:incident_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center"><div class="col-md-9">
  <div class="card"><div class="card-header">{{ action }} Incident</div>
  <div class="card-body">
    <form method="post" novalidate>{% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
        <div class="col-{% if field.widget_type == 'textarea' or field.name == 'description' or field.name == 'estimated_damage' %}12{% elif field.name == 'title' %}12{% else %}6{% endif %}">
          <label class="form-label fw-semibold">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-fire px-4"><i class="bi bi-check-lg me-1"></i>{{ action }}</button>
        <a href="{% url 'incidents:incident_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
