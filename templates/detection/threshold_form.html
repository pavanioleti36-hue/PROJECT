{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="section-header">
  <h1 class="section-title">{{ title }}</h1>
  <a href="{% url 'detection:threshold_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center"><div class="col-md-9">
  <div class="card"><div class="card-header">{{ action }} Threshold Configuration</div>
  <div class="card-body">
    <form method="post" novalidate>{% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
        <div class="col-md-4">
          <label class="form-label fw-semibold small">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-forest px-4">{{ action }}</button>
        <a href="{% url 'detection:threshold_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
